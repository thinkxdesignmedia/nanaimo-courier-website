<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e40af" stroke="#dc2626" stroke-width="3"/>

  <!-- Stylized courier icon: simplified package with motion lines -->
  <g transform="translate(50, 60)">
    <!-- Package/box -->
    <rect x="0" y="20" width="100" height="80" rx="4" fill="white" stroke="#1e40af" stroke-width="2"/>

    <!-- Top flap -->
    <polygon points="0,20 50,5 100,20" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>

    <!-- Motion lines (diagonal, suggesting speed/delivery) -->
    <line x1="110" y1="35" x2="130" y2="25" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="55" x2="130" y2="50" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="75" x2="130" y2="70" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
