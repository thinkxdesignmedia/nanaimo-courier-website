<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: gradient blue to dark -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Red accent stripe -->
  <rect y="500" width="1200" height="130" fill="#dc2626" />

  <!-- Main text -->
  <text x="60" y="200" font-size="80" font-weight="bold" fill="white" font-family="Arial, sans-serif">
    Nanaimo Courier
  </text>

  <text x="60" y="290" font-size="48" fill="white" font-family="Arial, sans-serif" opacity="0.95">
    Same-Day Delivery for Vancouver Island
  </text>

  <!-- Icon representation (simplified package) -->
  <g transform="translate(950, 200)">
    <rect width="200" height="200" rx="8" fill="white" stroke="#1e40af" stroke-width="4" />
    <polygon points="0,50 100,20 200,50" fill="#ffffff" stroke="#1e40af" stroke-width="3" />
    <!-- Motion lines -->
    <line x1="220" y1="70" x2="280" y2="50" stroke="#dc2626" stroke-width="5" stroke-linecap="round" />
    <line x1="220" y1="120" x2="280" y2="110" stroke="#dc2626" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Bottom tagline -->
  <text x="60" y="580" font-size="32" fill="white" font-family="Arial, sans-serif">
    Fast • Reliable • Professional
  </text>
</svg>
